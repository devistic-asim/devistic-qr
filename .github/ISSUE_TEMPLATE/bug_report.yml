name: Bug report
description: Something in Devistic QR does not work as expected
title: "Bug: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Create tab
        2. Choose Wi-Fi
        3. ...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 131 on macOS
    validations:
      required: true
  - type: dropdown
    id: theme
    attributes:
      label: Theme
      options:
        - Light
        - Dark
        - System
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: A screenshot or the exact QR contents helps. Do not include real Wi-Fi passwords or private contact details.
    validations:
      required: false
