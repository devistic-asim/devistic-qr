<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F5F9FC" />
    <script>
      (function () {
        var root = document.documentElement;
        var choice = 'system';
        try {
          choice = localStorage.getItem('devistic-qr-theme') || 'system';
        } catch (e) {
          choice = 'system';
        }
        if (choice !== 'light' && choice !== 'dark') choice = 'system';
        var dark =
          choice === 'dark' ||
          (choice === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        root.dataset.theme = dark ? 'dark' : 'light';
        root.dataset.themeChoice = choice;
        root.style.colorScheme = dark ? 'dark' : 'light';
        root.style.backgroundColor = dark ? '#0B1220' : '#F5F9FC';
        root.style.color = dark ? '#F5F9FC' : '#1E293B';
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#0B1220' : '#F5F9FC');
      })();
    </script>
    <title>Devistic QR — private QR codes in your browser</title>
    <meta
      name="description"
      content="Free private QR code generator and reader. Create a link, Wi-Fi, contact, email, SMS, or phone code, or read one from an image or camera. Nothing leaves your browser."
    />
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%favicon-16.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <style>
      .noscript {
        font-family: "Segoe UI", system-ui, sans-serif;
        margin: 1rem;
        color: #1e293b;
      }
    </style>
  </head>
  <body>
    <noscript>
      <p class="noscript">
        Devistic QR needs JavaScript. It still runs entirely in your browser, and nothing is sent to a server.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
